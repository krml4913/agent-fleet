name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux + git (already on the runner, sanity-check)
        run: |
          tmux -V
          git --version
      - name: Run preflight
        run: ./fleet preflight || true   # claude/codex are optional; ignore exit code
      - name: Run unittest (parallel)
        # Stdlib ProcessPoolExecutor runner over the same tests as
        # `python -m unittest discover tests` (see tests/run_parallel.py).
        run: python tests/run_parallel.py
      - name: Run unittest (serial reference)
        # Keep the plain discover entrypoint green (and catch any test that
        # only passes in a fresh worker) on one matrix leg.
        if: matrix.python-version == '3.12'
        run: python -m unittest discover tests
      - name: Run live tmux backend tests
        # Exercises fleet.mux.tmux against a real tmux server (isolated,
        # randomized session name; torn down by the tests).
        env:
          FLEET_LIVE_TMUX: "1"
        run: python -m unittest tests.test_mux_tmux -v

  unittest-windows:
    # Windows-compatible core (docs/windows-support.md §7 PR1). No tmux here:
    # tests that genuinely need tmux/POSIX skip on win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unittest (parallel)
        run: python tests/run_parallel.py
