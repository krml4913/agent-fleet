name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux + git (already on the runner, sanity-check)
        run: |
          tmux -V
          git --version
      - name: Run preflight
        run: ./fleet preflight || true   # claude/codex are optional; ignore exit code
      - name: Run unittest
        run: python -m unittest discover tests

  unittest-windows:
    # Windows-compatible core (docs/windows-support.md §7 PR1). No tmux here:
    # tests that genuinely need tmux/POSIX skip on win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unittest
        run: python -m unittest discover tests
