# Multi-stage — design then implement, with peer review and user approval gates.
name: multi_stage
description: Sequential pipeline with user approval at each stage.
stages:
  - role: designer
    agent: claude:opus
    user_approval: required
  - role: implementer
    agent: claude:sonnet
    peer_review:
      role: code-reviewer
      agent: claude:opus
    user_approval: required
